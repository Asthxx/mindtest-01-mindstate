<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0b2e">
<title>2026精神状态大摸底 · 趣味心理测试</title>
<style>
  :root{
    --bg1:#1a0b2e; --bg2:#2d1b4e; --pink:#ff5c8a; --orange:#ff9a5c;
    --cyan:#4fd1c5; --gold:#ffd166; --ink:#ffffff; --muted:rgba(255,255,255,.62);
    --card:rgba(255,255,255,.09); --line:rgba(255,255,255,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg1);overflow-x:hidden;
    display:flex;justify-content:center;min-height:100vh;
  }
  .bg{position:fixed;inset:0;z-index:0;background:
      radial-gradient(60% 45% at 15% 12%,rgba(255,92,138,.40),transparent 70%),
      radial-gradient(55% 45% at 88% 22%,rgba(79,209,197,.28),transparent 70%),
      radial-gradient(70% 60% at 50% 95%,rgba(255,154,92,.30),transparent 70%),
      linear-gradient(160deg,#1a0b2e,#2d1b4e 55%,#160a26);
    animation:float 14s ease-in-out infinite alternate;}
  @keyframes float{from{transform:scale(1)}to{transform:scale(1.08)}}
  .wrap{position:relative;z-index:1;width:100%;max-width:480px;padding:22px 20px 40px;min-height:100vh}

  /* ============ 通用 ============ */
  .page{display:none;animation:fade .45s ease both}
  .page.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px}
  .btn{cursor:pointer;border:none;font-family:inherit;font-weight:800;transition:transform .15s,box-shadow .2s,opacity .2s}
  .btn:active{transform:scale(.97)}
  .primary{width:100%;padding:16px;font-size:17px;color:#2a0a1a;border-radius:16px;
    background:linear-gradient(100deg,var(--gold),var(--orange),var(--pink));
    box-shadow:0 10px 30px rgba(255,92,138,.35)}
  .ghost{background:rgba(255,255,255,.10);color:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:15px}
  .tagline{color:var(--muted);font-size:13px;line-height:1.7}
  .eyebrow{display:inline-block;font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:800;margin-bottom:12px}

  /* ============ 首页 ============ */
  .hero{padding:36px 22px 26px;text-align:center;position:relative;overflow:hidden}
  .hero h1{font-size:34px;line-height:1.2;font-weight:900;letter-spacing:1px;
    background:linear-gradient(100deg,#fff,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .sub{margin-top:12px;font-size:15px;color:rgba(255,255,255,.85);font-weight:600}
  .hero .desc{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.7}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0 6px}
  .chip{font-size:12px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);
    border:1px solid var(--line);color:rgba(255,255,255,.9);animation:pop 3s ease-in-out infinite alternate}
  .chip:nth-child(odd){animation-delay:.6s}
  .chip:nth-child(3n){animation-delay:1.2s}
  @keyframes pop{from{transform:translateY(0)}to{transform:translateY(-4px)}}
  .meta{display:flex;justify-content:center;gap:20px;margin:22px 0 18px;font-size:12px;color:var(--muted)}
  .meta b{display:block;font-size:18px;color:#fff;font-weight:900}
  .trend{margin-top:16px;padding:14px 16px;font-size:12px;color:var(--muted);line-height:1.8;text-align:left}
  .trend strong{color:var(--cyan)}

  /* ============ 答题 ============ */
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--pink));transition:width .35s ease}
  .qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
  .qhead .num{color:var(--gold);font-weight:800}
  .qtitle{font-size:21px;font-weight:800;line-height:1.5;margin:6px 0 20px}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;
    background:var(--card);border:1px solid var(--line);color:#fff;font-size:15px;font-weight:600;line-height:1.5;backdrop-filter:blur(8px)}
  .opt .k{flex:none;width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
  .opt.sel{border-color:var(--pink);background:rgba(255,92,138,.18);box-shadow:0 0 0 2px rgba(255,92,138,.25)}
  .opt.sel .k{background:var(--pink);color:#2a0a1a}
  .nav{display:flex;gap:10px;margin-top:22px}
  .nav .btn{flex:1}
  .btn[disabled]{opacity:.35;cursor:not-allowed}
  .hint{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}

  /* ============ 结果 ============ */
  .result-head{text-align:center;padding:10px 0 4px}
  .result-head .emoji{font-size:62px;line-height:1;filter:drop-shadow(0 6px 16px rgba(0,0,0,.3))}
  .result-head .rtype{font-size:27px;font-weight:900;margin-top:12px}
  .result-head .rsub{font-size:14px;color:var(--gold);font-weight:700;margin-top:6px}
  .match{display:inline-block;margin-top:14px;font-size:12px;padding:7px 14px;border-radius:999px;
    background:rgba(255,209,102,.16);border:1px solid rgba(255,209,102,.35);color:var(--gold);font-weight:800}
  .rcard{margin-top:20px;padding:20px}
  .rcard h3{font-size:13px;color:var(--cyan);letter-spacing:1px;margin-bottom:10px;font-weight:800}
  .rcard p{font-size:14px;line-height:1.9;color:rgba(255,255,255,.9)}
  .traits{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .trait{font-size:12px;padding:6px 11px;border-radius:10px;background:rgba(79,209,197,.14);
    border:1px solid rgba(79,209,197,.3);color:#bff3ec;font-weight:700}
  .source{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.7}
  .source b{color:var(--pink)}
  .quote{margin-top:16px;padding:18px;border-radius:16px;font-size:15px;font-weight:800;line-height:1.7;
    background:linear-gradient(120deg,rgba(255,92,138,.18),rgba(255,154,92,.12));border:1px dashed rgba(255,255,255,.22);text-align:center}
  .sharebox{margin-top:18px;padding:16px;font-size:13px;line-height:1.8;color:rgba(255,255,255,.9)}
  .sharebox .lbl{color:var(--gold);font-weight:800;font-size:12px;margin-bottom:8px}
  .actions{display:flex;gap:10px;margin-top:16px}
  .actions .btn{flex:1}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#fff;color:#241033;padding:11px 20px;border-radius:999px;font-weight:800;font-size:13px;
    transition:.3s;z-index:99;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{text-align:center;font-size:11px;color:rgba(255,255,255,.35);margin-top:24px;line-height:1.8}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">

  <!-- ========== 首页 ========== -->
  <section class="page on" id="p-intro">
    <div class="hero glass">
      <span class="eyebrow">2026 · 年度热梗版</span>
      <h1>精神状态<br>大摸底</h1>
      <div class="sub">8道题，测出你的专属热梗人格</div>
      <div class="desc">全网都在认领的状态，你是哪一款？</div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="meta">
      <div><b>8</b>道题目</div>
      <div><b>8</b>种人格</div>
      <div><b>1</b>分钟</div>
    </div>

    <div class="trend glass">
      <strong>热点速递</strong> · 题目取材于近期抖音 / 小红书 / 微博高热梗：<br>
      「画地为牢」「省电模式」「纯过日子时代」「活人感 Aura」「已读乱回」「电子布洛芬」「分币不掏，主打浪漫」「一人公司·开爪」。测完即可生成同款分享文案。
    </div>

    <button class="btn primary" id="startBtn" style="margin-top:22px">开始测试 →</button>
    <div class="foot">趣味娱乐测试 · 结果仅供一乐 · 素材源自公开网络热词</div>
  </section>

  <!-- ========== 答题 ========== -->
  <section class="page" id="p-quiz">
    <div class="bar"><i id="barFill"></i></div>
    <div class="qhead"><span>QUESTION</span><span class="num" id="qnum">1 / 8</span></div>
    <div class="qtitle" id="qtitle"></div>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button class="btn ghost" id="prevBtn" disabled>上一题</button>
      <button class="btn ghost" id="nextBtn" disabled>下一题</button>
    </div>
    <div class="hint">选择最像你的一个答案</div>
  </section>

  <!-- ========== 结果 ========== -->
  <section class="page" id="p-result">
    <div class="result-head">
      <div class="emoji" id="rEmoji"></div>
      <div class="rtype" id="rType"></div>
      <div class="rsub" id="rSub"></div>
      <div class="match" id="rMatch"></div>
    </div>

    <div class="rcard glass">
      <h3>｜ 人格档案</h3>
      <p id="rDesc"></p>
      <div class="traits" id="rTraits"></div>
    </div>

    <div class="rcard glass">
      <h3>｜ 热词出处</h3>
      <div class="source" id="rSource"></div>
      <div class="quote" id="rQuote"></div>
    </div>

    <div class="sharebox glass">
      <div class="lbl">｜ 一键分享文案</div>
      <div id="rShare"></div>
    </div>

    <div class="actions">
      <button class="btn ghost" id="copyBtn">复制文案</button>
      <button class="btn ghost" id="againBtn">再测一次</button>
    </div>
    <div class="foot">2026精神状态大摸底 · 趣味娱乐，结果仅供一乐</div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 数据 ================= */
const TYPES = {
  draw:   {name:'画地为牢型', emoji:'🔒', sub:'困在原地，深情又内耗', color:'#ff5c8a',
    desc:'别人都往前走了，你还在心里那个圈里打转。不是走不出去，是有些人和事还没在心里翻篇。你深情、念旧，把遗憾酿成了自己的文学。',
    traits:['念旧','深情','易内耗','心软'],
    source:'出自综艺《后会友期》名台词「我画地为牢啊，厉娜」，11月刷屏全网，成为年度最虐情绪梗。',
    quote:'我画地为牢啊，工位。'},
  save:   {name:'省电模式型', emoji:'🔋', sub:'低电量生存，拒绝一切内耗', color:'#4fd1c5',
    desc:'你把人生调成了省电模式：不讨好、不解释、不加点。精力只留给真正重要的事，其余一律静音处理。你不是冷漠，是学会了给自己省电。',
    traits:['低能耗','边界感强','佛系','抗内耗'],
    source:'「进入省电模式」是2026年高频自嘲语，指主动降低情绪与社交消耗，把精力留给必要事项。',
    quote:'不是躺平，是战略性等待。'},
  life:   {name:'纯过日子型', emoji:'🍲', sub:'反内卷，把烟火气过成主线', color:'#ffd166',
    desc:'你早就退出了逆袭暴富的剧本，把重心放回了三餐四季。不卷人设，不追风口，只信一碗热汤、一场好觉。踏实，是你最高级的活法。',
    traits:['务实','恋家','反内卷','踏实'],
    source:'「全民进入纯过日子时代」为年度情绪热词，主张摒弃精致人设与无效内卷，回归柴米油盐。',
    quote:'过日子的人都来碰一下。'},
  real:   {name:'活人感选手', emoji:'✨', sub:'真实松弛，Aura拉满', color:'#ff9a5c',
    desc:'不装、不端、不演，是你最大的气场。别人在经营人设，你在认真做个人。这份松弛的「活人感」，反而是当下最稀缺的吸引力。',
    traits:['真实','松弛','真诚','有气场'],
    source:'「活人感」「Aura」入选2026年度热词，形容真实、不端着、自带氛围感的个人状态。',
    quote:'主打一个真实，Aura拉满。'},
  read:   {name:'已读乱回型', emoji:'💬', sub:'社交边界感天花板', color:'#a78bfa',
    desc:'消息已读，回复随缘。你深谙「答非所问」的艺术，既礼貌不冷场，又能精准终结话题。亲戚催婚、熟人尬聊，你都能四两拨千斤。',
    traits:['高情商','会敷衍','边界感','抗尬聊'],
    source:'「已读乱回」指读了消息却答非所问，主打礼貌与终结话题，被网友称为社交边界感天花板。',
    quote:'已读，乱回，但态度到位。'},
  buprofen:{name:'电子布洛芬型', emoji:'📱', sub:'靠快乐续命的情绪自愈派', color:'#60a5fa',
    desc:'你总有一段循环播放的视频、一个固定的博主，专门用来止痛。刷视频治不了病，但能让你撑过今天。你的快乐很轻，但很有效。',
    traits:['自愈','上头','治愈系','情绪缓冲'],
    source:'「电子布洛芬」指能瞬间缓解情绪疼痛的短视频、段子或直播，是年度高共鸣治愈系热词。',
    quote:'不是解药，是镇痛剂。'},
  free:   {name:'分币不掏型', emoji:'🌬️', sub:'低成本快乐，主打一个浪漫', color:'#34d399',
    desc:'一分钱不花，照样拥有极致浪漫。晚风、晚霞、晒太阳、逛马路，都被你列进快乐清单。你的快乐不依赖购物车，这本身就是一种清醒。',
    traits:['省钱','会享受','松弛','反消费'],
    source:'「分币不掏，主打浪漫」为下半年出圈热梗，主张零成本的松弛感才是成年人最珍贵的浪漫。',
    quote:'分币不掏，主打浪漫。'},
  claw:   {name:'开爪型', emoji:'🦞', sub:'一人公司，AI赋能效率党', color:'#f472b6',
    desc:'你把AI当「小龙虾」使唤，一个人就是一支队伍。别人还在手动搬砖，你已经让智能体替你干活了。效率，是你最锋利的武器。',
    traits:['效率控','会工具','新势力','行动派'],
    source:'「一人公司（OPC）」「开爪」为年度职场热词，指用AI智能体一个人撑起一支队伍的工作方式。',
    quote:'一人公司，开爪，干活。'}
};
const ORDER = Object.keys(TYPES);

const QUESTIONS = [
  {q:'周一早上闹钟响了，你的第一反应是？', opts:[
    {t:'draw',   x:'再躺五分钟，我跟被窝已经画地为牢了'},
    {t:'save',   x:'关掉闹钟，开启一天的低功耗模式'},
    {t:'life',   x:'起来烧壶水，日子总得过下去'},
    {t:'buprofen',x:'先刷十分钟短视频给自己续命'}]},
  {q:'朋友发来一串 60 秒语音方阵，你会？', opts:[
    {t:'save',   x:'先看文字，能不点开就不点开'},
    {t:'life',   x:'边做家务边听，权当背景音'},
    {t:'real',   x:'认真听完，一条条回，主打真诚'},
    {t:'read',   x:'已读，回一句「哈哈哈确实」'}]},
  {q:'购物车结算前，你的内心 OS 是？', opts:[
    {t:'life',   x:'家里还有存货，先不买了'},
    {t:'real',   x:'喜欢就买，开心最重要'},
    {t:'read',   x:'先加购，回头再说（然后忘了）'},
    {t:'free',   x:'删掉吧，晚风的浪漫不花钱'}]},
  {q:'遇到烦心事，你第一件事是？', opts:[
    {t:'real',   x:'找朋友吐槽，有话直说'},
    {t:'read',   x:'敷衍两句，把话题带走'},
    {t:'buprofen',x:'打开收藏夹循环我的电子布洛芬'},
    {t:'claw',   x:'让 AI 帮我梳理一下，出个方案'}]},
  {q:'周末的理想安排是？', opts:[
    {t:'read',   x:'谁约我，我都可能说「到时候看」'},
    {t:'buprofen',x:'躺平刷一整天，精神回血'},
    {t:'free',   x:'去公园晒太阳吹晚风，零消费'},
    {t:'claw',   x:'用 AI 规划行程，效率拉满'}]},
  {q:'刷到别人晒年终奖，你的反应是？', opts:[
    {t:'buprofen',x:'划走，看我的搞笑视频去'},
    {t:'free',   x:'我拥有的免费快乐比他多'},
    {t:'claw',   x:'研究下他的副业模式，抄作业'},
    {t:'draw',   x:'陷入比较，觉得自己困在原地'}]},
  {q:'关于「情绪价值」，你更认同哪句？', opts:[
    {t:'free',   x:'最好的情绪价值是免费的'},
    {t:'claw',   x:'情绪价值也能用工具批量生产'},
    {t:'draw',   x:'给出去的收不回，越给越困'},
    {t:'save',   x:'先顾好自己，别过度输出'}]},
  {q:'年底复盘，你给自己的关键词是？', opts:[
    {t:'claw',   x:'一个人就是一支队伍'},
    {t:'draw',   x:'有些事，还没过去'},
    {t:'save',   x:'能活着就挺好，别透支'},
    {t:'real',   x:'真实地过了一年，挺好'}]}
];

/* ================= 状态 ================= */
let cur = 0;
let answers = new Array(QUESTIONS.length).fill(null);

const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo({top:0,behavior:'instant'});
};
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('on'),1800);
}

/* ================= 首页渲染 ================= */
$('chips').innerHTML = ORDER.map(k=>`<span class="chip">${TYPES[k].emoji} ${TYPES[k].name}</span>`).join('');

/* ================= 答题流程 ================= */
function renderQuestion(){
  const item = QUESTIONS[cur];
  $('qnum').textContent = `${cur+1} / ${QUESTIONS.length}`;
  $('barFill').style.width = `${(cur/QUESTIONS.length)*100}%`;
  $('qtitle').textContent = item.q;
  $('opts').innerHTML = item.opts.map((o,i)=>
    `<button class="opt ${answers[cur]===i?'sel':''}" data-i="${i}">
       <span class="k">${'ABCD'[i]}</span><span>${o.x}</span>
     </button>`).join('');
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      answers[cur] = +btn.dataset.i;
      document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
      $('nextBtn').disabled = false;
      // 选择后短暂停留再自动进入下一题，提升流畅度
      clearTimeout(window._autoNext);
      if(cur < QUESTIONS.length-1){
        window._autoNext = setTimeout(()=>{ if(cur<QUESTIONS.length-1) goNext(); }, 420);
      }
    });
  });
  $('prevBtn').disabled = cur===0;
  $('nextBtn').disabled = answers[cur]===null;
  $('nextBtn').textContent = cur===QUESTIONS.length-1 ? '查看结果' : '下一题';
}
function goNext(){
  clearTimeout(window._autoNext);
  if(cur < QUESTIONS.length-1){ cur++; renderQuestion(); }
  else showResult();
}

$('startBtn').addEventListener('click',()=>{cur=0;answers.fill(null);renderQuestion();show('p-quiz');});
$('prevBtn').addEventListener('click',()=>{ clearTimeout(window._autoNext); if(cur>0){cur--;renderQuestion();} });
$('nextBtn').addEventListener('click',goNext);

/* ================= 计分与结果 ================= */
function showResult(){
  const score = {};
  ORDER.forEach(k=>score[k]=0);
  answers.forEach((i,q)=>{ if(i!==null) score[QUESTIONS[q].opts[i].t]++; });

  let best = ORDER[0];
  ORDER.forEach(k=>{ if(score[k]>score[best]) best=k; });
  // 并列时优先最近一次选择的类型
  const lastType = QUESTIONS[QUESTIONS.length-1].opts[answers[QUESTIONS.length-1]].t;
  const top = Math.max(...ORDER.map(k=>score[k]));
  ORDER.forEach(k=>{ if(score[k]===top && k===lastType) best=k; });

  const T = TYPES[best];
  const total = answers.filter(x=>x!==null).length;
  const match = Math.min(99, 84 + Math.round((score[best]/Math.max(total,1))*18));

  $('rEmoji').textContent = T.emoji;
  $('rType').textContent = T.name;
  $('rSub').textContent = T.sub;
  $('rMatch').textContent = `匹配度 ${match}% · 打败了 ${Math.min(98,match+3)}% 的玩家`;
  $('rDesc').textContent = T.desc;
  $('rTraits').innerHTML = T.traits.map(t=>`<span class="trait"># ${t}</span>`).join('');
  $('rSource').innerHTML = `<b>${T.name}</b> · ${T.source}`;
  $('rQuote').textContent = `「${T.quote}」`;
  const shareText = `我的2026精神状态是【${T.name}】${T.emoji}\n${T.sub}｜匹配度 ${match}%\n${T.quote}\n👉 来测测你是哪一款？ #${T.name.replace('型','')} #2026精神状态大摸底`;
  $('rShare').textContent = shareText;
  $('copyBtn')._text = shareText;

  $('barFill').style.width = '100%';
  show('p-result');
}

/* ================= 分享 / 重测 ================= */
$('copyBtn').addEventListener('click',async()=>{
  const text = $('copyBtn')._text || '';
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); }
    else{
      const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    }
    toast('文案已复制，去分享吧！');
  }catch(e){ toast('复制失败，请长按手动复制'); }
});
$('againBtn').addEventListener('click',()=>{cur=0;answers.fill(null);renderQuestion();show('p-quiz');});
</script>
